[build]
  command = "pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# SPA: todas las rutas las resuelve el router del cliente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y el manifest nunca se cachean en el CDN/navegador
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
